# Production stack behind the shared production Traefik (HTTPS via the
# configured certificate resolver). Never copy development hostnames here.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    restart: unless-stopped
    networks: [proxy]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy-net}
      - traefik.http.routers.${APP_SLUG:-becks-clay-figures}-api.rule=Host(`${APP_DOMAIN:-becksclay.gravvisoft.com}`) && PathPrefix(`/api`)
      - traefik.http.routers.${APP_SLUG:-becks-clay-figures}-api.entrypoints=${TRAEFIK_PROD_ENTRYPOINT:-websecure}
      - traefik.http.routers.${APP_SLUG:-becks-clay-figures}-api.tls=true
      - traefik.http.routers.${APP_SLUG:-becks-clay-figures}-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${APP_SLUG:-becks-clay-figures}-api.priority=100
      - traefik.http.routers.${APP_SLUG:-becks-clay-figures}-api.service=${APP_SLUG:-becks-clay-figures}-api
      - traefik.http.middlewares.${APP_SLUG:-becks-clay-figures}-api-compress.compress=true
      - traefik.http.routers.${APP_SLUG:-becks-clay-figures}-api.middlewares=${APP_SLUG:-becks-clay-figures}-api-compress
      - traefik.http.services.${APP_SLUG:-becks-clay-figures}-api.loadbalancer.server.port=5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy-net}
      - traefik.http.routers.${APP_SLUG:-becks-clay-figures}-web.rule=Host(`${APP_DOMAIN:-becksclay.gravvisoft.com}`)
      - traefik.http.routers.${APP_SLUG:-becks-clay-figures}-web.entrypoints=${TRAEFIK_PROD_ENTRYPOINT:-websecure}
      - traefik.http.routers.${APP_SLUG:-becks-clay-figures}-web.tls=true
      - traefik.http.routers.${APP_SLUG:-becks-clay-figures}-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${APP_SLUG:-becks-clay-figures}-web.priority=10
      - traefik.http.routers.${APP_SLUG:-becks-clay-figures}-web.service=${APP_SLUG:-becks-clay-figures}-web
      - traefik.http.services.${APP_SLUG:-becks-clay-figures}-web.loadbalancer.server.port=80

  gallery-worker:
    profiles: ["gallery-assets"]
    build:
      context: ./backend
      dockerfile: Dockerfile.gallery-worker
    env_file: .env
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2

  example-job:
    profiles: ["jobs"]
    build:
      context: ./jobs/example
    env_file: .env

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy-net}
