# Development stack. Joins the already-running shared Traefik on the external
# proxy network and routes only DEV_APP_DOMAIN (boilerplate.localhost). It binds
# no host ports and adds no bare `localhost` router, so it runs beside other
# local apps on the same Traefik without colliding.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_APP: app.py
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
      # When DEV_CONNECTION_STRING is set, the dev stack uses that separate
      # database instead of the shared CONNECTION_STRING.
      CONNECTION_STRING: ${DEV_CONNECTION_STRING:-${CONNECTION_STRING}}
    volumes:
      - ./backend:/app
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy-net}
      - traefik.http.routers.${APP_SLUG:-boilerplate}-api-dev.rule=Host(`${DEV_APP_DOMAIN:-boilerplate.localhost}`) && PathPrefix(`/api`)
      - traefik.http.routers.${APP_SLUG:-boilerplate}-api-dev.entrypoints=${TRAEFIK_DEV_ENTRYPOINT:-web}
      - traefik.http.routers.${APP_SLUG:-boilerplate}-api-dev.priority=100
      - traefik.http.routers.${APP_SLUG:-boilerplate}-api-dev.service=${APP_SLUG:-boilerplate}-api-dev
      - traefik.http.middlewares.${APP_SLUG:-boilerplate}-api-compress-dev.compress=true
      - traefik.http.routers.${APP_SLUG:-boilerplate}-api-dev.middlewares=${APP_SLUG:-boilerplate}-api-compress-dev
      - traefik.http.services.${APP_SLUG:-boilerplate}-api-dev.loadbalancer.server.port=5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-/api}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      BROWSER: none
      CHOKIDAR_USEPOLLING: "true"
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"
      # Hot-reload websocket goes through Traefik on the page's own port.
      WDS_SOCKET_PORT: "0"
      REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-/api}
    # Only live-edit folders are mounted; dependencies stay inside the image.
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy-net}
      - traefik.http.routers.${APP_SLUG:-boilerplate}-web-dev.rule=Host(`${DEV_APP_DOMAIN:-boilerplate.localhost}`)
      - traefik.http.routers.${APP_SLUG:-boilerplate}-web-dev.entrypoints=${TRAEFIK_DEV_ENTRYPOINT:-web}
      - traefik.http.routers.${APP_SLUG:-boilerplate}-web-dev.priority=10
      - traefik.http.routers.${APP_SLUG:-boilerplate}-web-dev.service=${APP_SLUG:-boilerplate}-web-dev
      - traefik.http.services.${APP_SLUG:-boilerplate}-web-dev.loadbalancer.server.port=3000

  example-job:
    profiles: ["jobs"]
    build:
      context: ./jobs/example
    env_file: .env
    environment:
      CONNECTION_STRING: ${DEV_CONNECTION_STRING:-${CONNECTION_STRING}}

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy-net}
